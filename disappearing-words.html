<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disappearing Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --focus: #0B62A4;
    --board: #C9C3EA;
    --gap: #F2D9A6;
    --gap-hover: #EECB85;
    --warn: #A8324A;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--mist); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }

  .page {
    height: 100%; max-width: 1400px; margin: 0 auto;
    padding: clamp(0.75rem, 2vw, 1.5rem) clamp(1rem, 3vw, 2.25rem);
    display: flex; flex-direction: column; gap: clamp(0.5rem, 1.5vh, 1rem);
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .top h1 { margin: 0; font-size: clamp(1.5rem, 2.8vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .back { color: var(--ink-soft); font-size: 0.95rem; text-decoration: none; white-space: nowrap; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .board {
    flex: 1; min-height: 0; background: var(--board); border-radius: 0.9rem;
    padding: clamp(1rem, 2.5vw, 2rem); display: flex; flex-direction: column;
  }
  [hidden] { display: none !important; }

  /* Setup */
  .setup label { display: block; font-weight: 700; font-size: clamp(1.05rem, 1.6vw, 1.3rem); margin-bottom: 0.4rem; }
  .setup input, .setup textarea {
    width: 100%; font: inherit; font-size: 1.1rem; color: var(--ink);
    background: var(--mist); border: 2px solid transparent; border-radius: 0.6rem; padding: 0.6em 0.8em;
  }
  .setup input:focus-visible, .setup textarea:focus-visible { outline: none; border-color: var(--focus); }
  .setup input { margin-bottom: 1rem; max-width: 32rem; }
  .setup textarea { flex: 1; min-height: 10rem; resize: none; line-height: 1.5; }
  .setup .field { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .count { margin: 0.4rem 0 0; font-size: 0.95rem; color: var(--ink-soft); font-weight: 600; }
  .count.over { color: var(--warn); }

  /* Game */
  .game-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: clamp(0.5rem, 1.5vh, 1rem); }
  .game-head h2 { margin: 0; font-size: clamp(1.2rem, 2.2vw, 1.8rem); font-weight: 700; }
  .hint { margin: 0.15em 0 0; font-size: clamp(0.95rem, 1.4vw, 1.15rem); color: var(--ink-soft); }
  .progress { font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .passage-wrap { flex: 1; min-height: 0; overflow: hidden; }
  .passage { margin: 0; line-height: 1.85; }
  .passage p { margin: 0 0 0.6em; }
  .word {
    font: inherit; color: var(--ink); background-color: transparent; border: 0;
    padding: 0.02em 0.22em; margin: 0; border-radius: 0.55em; cursor: pointer;
    transition: color 0.35s ease, background-color 0.35s ease, box-shadow 0.35s ease, transform 0.2s ease;
  }
  .word:hover { background-color: rgba(16, 48, 58, 0.08); }
  .word:active { transform: scale(0.96); }
  .word:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .word.erased {
    color: transparent;
    background-color: var(--gap);
    box-shadow: inset 0 -0.12em 0 rgba(16, 48, 58, 0.12);
  }
  .word.erased:hover { background-color: var(--gap-hover); }

  .controls { margin-top: clamp(0.75rem, 2vh, 1.25rem); display: flex; gap: 0.6rem; flex-wrap: wrap; }
  button.btn {
    font: inherit; font-weight: 600; font-size: 1rem; padding: 0.55em 1.1em; border-radius: 0.6rem;
    border: 2px solid var(--ink); background: var(--ink); color: var(--mist); cursor: pointer;
  }
  button.btn.ghost { background: transparent; color: var(--ink); }
  button.btn:hover { filter: brightness(1.15); }
  button.btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
  button.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  @media (max-width: 700px) {
    html, body, .page { height: auto; }
    .passage-wrap { overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { .word { transition: none; } .word:active { transform: none; } }
</style>
</head>
<body>
<div class="page">

  <div class="top">
    <h1>Disappearing Words</h1>
    <a class="back" href="https://coastoflight.github.io/pickers-thinkers/">&larr; Pickers and Thinkers</a>
  </div>

  <!-- Step 1: paste a text -->
  <section class="board setup" id="setup">
    <label for="title">Title (optional)</label>
    <input id="title" type="text" maxlength="60" placeholder="My Free Time">

    <div class="field">
      <label for="text">Paste your text</label>
      <textarea id="text" placeholder="In my free time, I like playing video games with my brother…"></textarea>
      <p class="count" id="count">0 / 150 words</p>
    </div>

    <div class="controls">
      <button class="btn" id="start" disabled>Start</button>
    </div>
  </section>

  <!-- Step 2: the game -->
  <section class="board" id="game" hidden>
    <div class="game-head">
      <div>
        <h2 id="gameTitle"></h2>
        <p class="hint">(tap to make a word disappear)</p>
      </div>
      <span class="progress"><span id="erased">0</span> / <span id="total">0</span> erased</span>
    </div>
    <div class="passage-wrap" id="wrap">
      <div class="passage" id="passage"></div>
    </div>
    <div class="controls">
      <button class="btn" id="showAll">Show all words</button>
      <button class="btn ghost" id="edit">Change the text</button>
    </div>
  </section>

</div>

<script>
  const LIMIT = 150;
  const $ = id => document.getElementById(id);
  const textEl = $("text"), countEl = $("count"), startBtn = $("start");
  const passageEl = $("passage"), wrapEl = $("wrap");

  const countWords = t => (t.trim().match(/\S+/g) || []).length;

  function updateCount() {
    const n = countWords(textEl.value);
    countEl.textContent = n > LIMIT ? `${n} / ${LIMIT} words. Please make it shorter.` : `${n} / ${LIMIT} words`;
    countEl.classList.toggle("over", n > LIMIT);
    startBtn.disabled = n === 0 || n > LIMIT;
  }
  textEl.addEventListener("input", updateCount);

  function updateProgress() {
    $("erased").textContent = passageEl.querySelectorAll(".word.erased").length;
  }

  // Make the text as big as possible while still fitting the board
  function fit() {
    if (window.matchMedia("(max-width: 700px)").matches) { passageEl.style.fontSize = "1.2rem"; return; }
    let size = 64;
    passageEl.style.fontSize = size + "px";
    while (size > 16 && passageEl.scrollHeight > wrapEl.clientHeight) {
      size -= 2;
      passageEl.style.fontSize = size + "px";
    }
  }

  function start() {
    const title = $("title").value.trim();
    $("gameTitle").textContent = title;
    passageEl.innerHTML = "";
    let total = 0;

    // Keep the paragraphs from the pasted text
    textEl.value.trim().split(/\n\s*\n|\n/).filter(p => p.trim()).forEach(para => {
      const p = document.createElement("p");
      para.trim().split(/\s+/).forEach(w => {
        const b = document.createElement("button");
        b.className = "word"; b.type = "button"; b.textContent = w;
        b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", () => {
          const on = b.classList.toggle("erased");
          b.setAttribute("aria-pressed", String(on));
          updateProgress();
        });
        p.appendChild(b);
        p.appendChild(document.createTextNode(" "));
        total++;
      });
      passageEl.appendChild(p);
    });

    $("total").textContent = total;
    updateProgress();
    $("setup").hidden = true;
    $("game").hidden = false;
    fit();
  }

  startBtn.addEventListener("click", start);
  $("showAll").addEventListener("click", () => {
    passageEl.querySelectorAll(".word.erased").forEach(w => {
      w.classList.remove("erased"); w.setAttribute("aria-pressed", "false");
    });
    updateProgress();
  });
  $("edit").addEventListener("click", () => {
    $("game").hidden = true;
    $("setup").hidden = false;
    textEl.focus();
  });
  window.addEventListener("resize", () => { if (!$("game").hidden) fit(); });

  updateCount();
</script>
</body>
</html>
